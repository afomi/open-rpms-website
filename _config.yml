url: "" # the base hostname & protocol for your site, e.g. http://example.com
# baseurl: "" # the subpath of your site, e.g. /blog
baseurl: ""

title: "OpenRPMS"

description: "Open-source documentation and reference for the Indian Health Service (IHS) Resource and Patient Management System (RPMS) and Electronic Health Record (EHR) — clinical workflows, domain model, and architecture for open healthcare."

author:
  name: "OpenRPMS contributors"
  url: "https://openrpms.org/contributors"

keywords: "open source healthcare, Indian Health Service, IHS, RPMS, EHR, Electronic Health Record, Resource and Patient Management System, clinical workflows, open healthcare, tribal health"

permalink: /blog/:title/

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-datapage-generator

page_gen:
  - data: packages
    template: package
    name: namespace
    dir: packages
    title: name
  - data: workflows
    template: workflow
    name: id
    dir: workflows
    title: name

exclude:
  - package.json
  - package-lock.json
  - postcss.config.js
  - tailwind.config.js
  - node_modules
  - Gemfile
  - Gemfile.lock
